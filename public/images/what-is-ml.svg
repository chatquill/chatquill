  <text x="960" y="205" font-family="'DM Mono', monospace" font-size="14" fill="#1a1208" text-anchor="middle">📧</text>

  <!-- Node 2 -->
  <circle cx="960" cy="360" r="36" fill="url(#nodeGlowOrange)"/>
  <circle cx="960" cy="360" r="22" fill="#fdf8f0" stroke="#f97316" stroke-width="1.8" opacity="0.9"/>
