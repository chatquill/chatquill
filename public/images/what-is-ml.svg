  <line x1="1130" y1="560" x2="1290" y2="390" stroke="#3b82f6" stroke-width="1" opacity="0.12"/>
  <line x1="1130" y1="560" x2="1290" y2="550" stroke="#3b82f6" stroke-width="1" opacity="0.18"/>
  <line x1="1130" y1="660" x2="1290" y2="550" stroke="#3b82f6" stroke-width="1" opacity="0.14"/>
  <line x1="1130" y1="660" x2="1290" y2="680" stroke="#3b82f6" stroke-width="1" opacity="0.18"/>

