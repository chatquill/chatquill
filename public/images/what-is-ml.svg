  <text x="1130" y="760" font-family="'DM Mono', monospace" font-size="10" fill="#c8b09a" text-anchor="middle" letter-spacing="2">HIDDEN</text>
  <text x="1290" y="760" font-family="'DM Mono', monospace" font-size="10" fill="#c8b09a" text-anchor="middle" letter-spacing="2">HIDDEN</text>
  <text x="1450" y="760" font-family="'DM Mono', monospace" font-size="10" fill="#c8b09a" text-anchor="middle" letter-spacing="2">OUTPUT</text>

