<svg viewBox="0 0 1600 840" xmlns="http://www.w3.org/2000/svg" width="1600" height="840">
  <defs>
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,900;1,9..144,700&amp;family=DM+Mono:wght@300;400;500&amp;display=swap');
    </style>

    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fdf8f0;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#f7f0e4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0e8d8;stop-opacity:1" />
    </linearGradient>

    <!-- Warm glow for right side -->
    <radialGradient id="warmGlow" cx="75%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff8c3a;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#ff8c3a;stop-opacity:0" />
    </radialGradient>

    <!-- Node glow orange -->
    <radialGradient id="nodeGlowOrange" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:0" />
    </radialGradient>

    <!-- Node glow blue -->
    <radialGradient id="nodeGlowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0" />
    </radialGradient>

    <!-- Node glow green -->
    <radialGradient id="nodeGlowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0" />
    </radialGradient>

    <!-- Node glow purple -->
    <radialGradient id="nodeGlowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0" />
    </radialGradient>

    <!-- Dot pattern -->
    <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1" fill="#c8b89a" opacity="0.4"/>
    </pattern>

    <!-- Clip for right panel -->
    <clipPath id="rightClip">
      <rect x="820" y="0" width="780" height="840"/>
    </clipPath>
  </defs>

  <!-- Base background -->
  <rect width="1600" height="840" fill="url(#bgGrad)"/>

  <!-- Dot texture -->
  <rect width="1600" height="840" fill="url(#dots)"/>

  <!-- Warm glow right -->
  <rect width="1600" height="840" fill="url(#warmGlow)"/>

  <!-- Vertical divider line -->
  <line x1="820" y1="60" x2="820" y2="780" stroke="#d4c4a8" stroke-width="1"/>

  <!-- ── LEFT PANEL ── -->

  <!-- Series label -->
  <line x1="80" y1="108" x2="112" y2="108" stroke="#f97316" stroke-width="2"/>
  <circle cx="120" cy="108" r="4" fill="#f97316"/>
  <text x="136" y="114" font-family="'DM Mono', monospace" font-size="13" fill="#f97316" letter-spacing="3" font-weight="500">BEGINNER'S SERIES</text>

  <!-- Main headline -->
  <!-- "What Is" -->
  <text x="80" y="230" font-family="Georgia, 'Times New Roman', serif" font-size="108" fill="#1a1208" font-weight="900" letter-spacing="-2">What Is</text>

  <!-- "Machine" — orange italic -->
  <text x="80" y="348" font-family="Georgia, 'Times New Roman', serif" font-size="128" fill="#f97316" font-weight="900" font-style="italic" letter-spacing="-3">Machine</text>

  <!-- "Learning?" -->
  <text x="80" y="456" font-family="Georgia, 'Times New Roman', serif" font-size="108" fill="#1a1208" font-weight="900" letter-spacing="-2">Learning?</text>

  <!-- Zero math badge -->
  <rect x="80" y="494" width="340" height="46" rx="23" fill="#1a1208"/>
  <text x="250" y="523" font-family="'DM Mono', monospace" font-size="14" fill="#f7f0e4" text-anchor="middle" letter-spacing="2" font-weight="400">EXPLAINED WITH ZERO MATH ✓</text>

  <!-- Description line -->
  <text x="80" y="596" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#8a7a60" font-style="italic">No equations. No matrices. No prerequisites.</text>
  <text x="80" y="622" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#8a7a60" font-style="italic">Just the real idea, explained clearly.</text>

  <!-- Concept pills row -->
  <!-- Supervised -->
  <rect x="80" y="658" width="148" height="36" rx="18" fill="none" stroke="#f97316" stroke-width="1.5"/>
  <text x="154" y="681" font-family="'DM Mono', monospace" font-size="12" fill="#f97316" text-anchor="middle" letter-spacing="1">Supervised</text>

  <!-- Unsupervised -->
  <rect x="240" y="658" width="168" height="36" rx="18" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="324" y="681" font-family="'DM Mono', monospace" font-size="12" fill="#3b82f6" text-anchor="middle" letter-spacing="1">Unsupervised</text>

  <!-- Reinforcement -->
  <rect x="420" y="658" width="172" height="36" rx="18" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <text x="506" y="681" font-family="'DM Mono', monospace" font-size="12" fill="#10b981" text-anchor="middle" letter-spacing="1">Reinforcement</text>

  <!-- Author row -->
  <line x1="80" y1="735" x2="740" y2="735" stroke="#d4c4a8" stroke-width="1"/>

  <!-- Avatar circle -->
  <circle cx="104" cy="770" r="22" fill="#f97316" opacity="0.9"/>
  <text x="104" y="777" font-family="Georgia, serif" font-size="18" fill="white" text-anchor="middle" font-weight="700">M</text>

  <!-- Author name -->
  <text x="138" y="762" font-family="'DM Mono', monospace" font-size="14" fill="#1a1208" font-weight="500" letter-spacing="0.5">Mohun Shakeel Ahmad</text>
  <text x="138" y="782" font-family="'DM Mono', monospace" font-size="11" fill="#8a7a60" letter-spacing="0.5">Software Engineer · MSc Data Science · Mauritius</text>

  <!-- Read time -->
  <rect x="650" y="755" width="110" height="30" rx="15" fill="none" stroke="#d4c4a8" stroke-width="1"/>
  <text x="705" y="775" font-family="'DM Mono', monospace" font-size="11" fill="#8a7a60" text-anchor="middle" letter-spacing="1">5 MIN READ</text>


  <!-- ── RIGHT PANEL — Neural Network Illustration ── -->

  <!-- Right panel subtle bg -->
  <rect x="820" y="0" width="780" height="840" fill="#1a1208" opacity="0.02"/>

  <!-- Right panel label -->
  <text x="880" y="80" font-family="'DM Mono', monospace" font-size="11" fill="#8a7a60" letter-spacing="3">// how it works</text>

  <!-- ════ NEURAL NETWORK ════ -->
  <!-- Layer labels -->
