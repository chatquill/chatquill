  <circle cx="1130" cy="300" r="18" fill="#fdf8f0" stroke="#3b82f6" stroke-width="1.5" opacity="0.85"/>
  <circle cx="1130" cy="300" r="8" fill="#3b82f6" opacity="0.6"/>

  <circle cx="1130" cy="430" r="30" fill="url(#nodeGlowBlue)"/>
  <circle cx="1130" cy="430" r="18" fill="#fdf8f0" stroke="#3b82f6" stroke-width="1.5" opacity="0.85"/>
  <circle cx="1130" cy="430" r="8" fill="#3b82f6" opacity="0.6"/>

  <circle cx="1130" cy="560" r="30" fill="url(#nodeGlowBlue)"/>
  <circle cx="1130" cy="560" r="18" fill="#fdf8f0" stroke="#3b82f6" stroke-width="1.5" opacity="0.85"/>
  <circle cx="1130" cy="560" r="8" fill="#3b82f6" opacity="0.6"/>

  <circle cx="1130" cy="660" r="30" fill="url(#nodeGlowBlue)"/>
  <circle cx="1130" cy="660" r="18" fill="#fdf8f0" stroke="#3b82f6" stroke-width="1.5" opacity="0.85"/>
  <circle cx="1130" cy="660" r="8" fill="#3b82f6" opacity="0.6"/>

  <!-- ── HIDDEN LAYER 2 NODES (x=1290) ── -->
  <circle cx="1290" cy="230" r="28" fill="url(#nodeGlowPurple)"/>
  <circle cx="1290" cy="230" r="17" fill="#fdf8f0" stroke="#8b5cf6" stroke-width="1.5" opacity="0.85"/>
  <circle cx="1290" cy="230" r="7" fill="#8b5cf6" opacity="0.6"/>

  <circle cx="1290" cy="390" r="28" fill="url(#nodeGlowPurple)"/>
  <circle cx="1290" cy="390" r="17" fill="#fdf8f0" stroke="#8b5cf6" stroke-width="1.5" opacity="0.85"/>
  <circle cx="1290" cy="390" r="7" fill="#8b5cf6" opacity="0.6"/>

  <circle cx="1290" cy="550" r="28" fill="url(#nodeGlowPurple)"/>
  <circle cx="1290" cy="550" r="17" fill="#fdf8f0" stroke="#8b5cf6" stroke-width="1.5" opacity="0.85"/>
  <circle cx="1290" cy="550" r="7" fill="#8b5cf6" opacity="0.6"/>

  <circle cx="1290" cy="680" r="28" fill="url(#nodeGlowPurple)"/>
  <circle cx="1290" cy="680" r="17" fill="#fdf8f0" stroke="#8b5cf6" stroke-width="1.5" opacity="0.85"/>
  <circle cx="1290" cy="680" r="7" fill="#8b5cf6" opacity="0.6"/>

  <!-- ── OUTPUT NODE (x=1450) ── -->
  <circle cx="1450" cy="420" r="52" fill="url(#nodeGlowGreen)"/>
  <circle cx="1450" cy="420" r="36" fill="#fdf8f0" stroke="#10b981" stroke-width="2" opacity="0.9"/>
  <circle cx="1450" cy="420" r="22" fill="#10b981" opacity="0.15" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="1450" cy="420" r="12" fill="#10b981" opacity="0.8"/>
  <circle cx="1450" cy="420" r="5" fill="#10b981"/>
  <text x="1450" y="476" font-family="'DM Mono', monospace" font-size="10" fill="#8a7a60" text-anchor="middle" letter-spacing="1">PREDICT</text>

  <!-- Floating data point decorations -->
  <circle cx="1045" cy="265" r="3.5" fill="#f97316" opacity="0.5"/>
  <circle cx="1045" cy="455" r="3" fill="#f97316" opacity="0.4"/>
  <circle cx="1045" cy="590" r="3.5" fill="#f97316" opacity="0.5"/>
  <circle cx="1210" cy="215" r="3" fill="#3b82f6" opacity="0.45"/>
  <circle cx="1210" cy="345" r="3.5" fill="#3b82f6" opacity="0.5"/>
  <circle cx="1210" cy="500" r="3" fill="#3b82f6" opacity="0.4"/>
  <circle cx="1210" cy="620" r="3.5" fill="#3b82f6" opacity="0.45"/>
  <circle cx="1370" cy="310" r="3" fill="#8b5cf6" opacity="0.45"/>
  <circle cx="1370" cy="470" r="3.5" fill="#8b5cf6" opacity="0.5"/>
  <circle cx="1370" cy="616" r="3" fill="#8b5cf6" opacity="0.4"/>

  <!-- Train → Model → Predict flow label at top right -->
  <rect x="856" y="88" width="540" height="50" rx="8" fill="#1a1208" opacity="0.04"/>
  <text x="876" y="118" font-family="'DM Mono', monospace" font-size="13" fill="#8a7a60" letter-spacing="2">TRAIN</text>
  <text x="948" y="118" font-family="'DM Mono', monospace" font-size="13" fill="#c8b09a">→</text>
  <text x="972" y="118" font-family="'DM Mono', monospace" font-size="13" fill="#8a7a60" letter-spacing="2">MODEL</text>
  <text x="1056" y="118" font-family="'DM Mono', monospace" font-size="13" fill="#c8b09a">→</text>
  <text x="1080" y="118" font-family="'DM Mono', monospace" font-size="13" fill="#8a7a60" letter-spacing="2">PREDICT</text>

  <!-- Thin decorative border around entire image -->
