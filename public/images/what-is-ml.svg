  <!-- From node (960,200) -->
  <line x1="960" y1="200" x2="1130" y2="170" stroke="#f97316" stroke-width="1" opacity="0.18"/>
  <line x1="960" y1="200" x2="1130" y2="300" stroke="#f97316" stroke-width="1" opacity="0.12"/>
  <line x1="960" y1="200" x2="1130" y2="430" stroke="#f97316" stroke-width="1" opacity="0.08"/>
  <line x1="960" y1="200" x2="1130" y2="560" stroke="#f97316" stroke-width="1" opacity="0.06"/>
  <!-- From node (960,360) -->
  <line x1="960" y1="360" x2="1130" y2="170" stroke="#f97316" stroke-width="1" opacity="0.10"/>
  <line x1="960" y1="360" x2="1130" y2="300" stroke="#f97316" stroke-width="1" opacity="0.18"/>
  <line x1="960" y1="360" x2="1130" y2="430" stroke="#f97316" stroke-width="1" opacity="0.14"/>
  <line x1="960" y1="360" x2="1130" y2="560" stroke="#f97316" stroke-width="1" opacity="0.08"/>
  <!-- From node (960,520) -->
  <line x1="960" y1="520" x2="1130" y2="170" stroke="#f97316" stroke-width="1" opacity="0.06"/>
  <line x1="960" y1="520" x2="1130" y2="300" stroke="#f97316" stroke-width="1" opacity="0.10"/>
  <line x1="960" y1="520" x2="1130" y2="430" stroke="#f97316" stroke-width="1" opacity="0.18"/>
  <line x1="960" y1="520" x2="1130" y2="560" stroke="#f97316" stroke-width="1" opacity="0.14"/>
  <!-- From node (960,660) -->
