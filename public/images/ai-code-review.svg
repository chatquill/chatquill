    <stop offset="0%" stop-color="#050b13"/>
    <stop offset="55%" stop-color="#08121e"/>
    <stop offset="100%" stop-color="#0b1a14"/>
  </linearGradient>
  <radialGradient id="glowL" cx="420" cy="400" r="480" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#00e5a0" stop-opacity="0.11"/>
    <stop offset="100%" stop-color="#00e5a0" stop-opacity="0"/>
