  </radialGradient>
  <linearGradient id="scanBeam" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
    <stop offset="0%"   stop-color="#00e5a0" stop-opacity="0"/>
    <stop offset="25%"  stop-color="#00e5a0" stop-opacity="0.9"/>
    <stop offset="75%"  stop-color="#00e5a0" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#00e5a0" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow" x="-400%" y="-20%" width="900%" height="140%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="22"/>
  </filter>
  <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
    <circle cx="16" cy="16" r="0.75" fill="#1e2d3d" opacity="0.55"/>
  </pattern>
  <clipPath id="editorClip">
    <rect x="60" y="136" width="790" height="598"/>
  </clipPath>
</defs>

