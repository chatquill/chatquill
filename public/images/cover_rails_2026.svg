<svg viewBox="0 0 1600 840" xmlns="http://www.w3.org/2000/svg" width="1600" height="840">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0a08"/>
      <stop offset="50%" stop-color="#200c08"/>
      <stop offset="100%" stop-color="#140806"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="38%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#cc2200" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#cc2200" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="topGlow" cx="50%" cy="0%" r="50%">
      <stop offset="0%" stop-color="#ff4422" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ff4422" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rubyGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ff6644"/>
      <stop offset="40%" stop-color="#cc2200"/>
      <stop offset="100%" stop-color="#7a0e00"/>
    </radialGradient>
    <radialGradient id="rubyShine" cx="30%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#ffccbb" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffccbb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="75%" stop-color="#000" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.92"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,80,40,0.04)" stroke-width="0.5"/>
    </pattern>
    <filter id="rubyGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="atmosBlur">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <clipPath id="canvas">
      <rect width="1600" height="840"/>
    </clipPath>
  </defs>

  <g clip-path="url(#canvas)">
    <rect width="1600" height="840" fill="url(#bg)"/>
    <rect width="1600" height="840" fill="url(#grid)"/>
    <rect width="1600" height="840" fill="url(#centerGlow)"/>
    <rect width="1600" height="840" fill="url(#topGlow)"/>

    <ellipse cx="500" cy="420" rx="300" ry="250" fill="#cc2200" opacity="0.07" filter="url(#atmosBlur)"/>
    <ellipse cx="900" cy="200" rx="200" ry="150" fill="#ff4422" opacity="0.05" filter="url(#atmosBlur)"/>

    <rect x="820" y="120" width="680" height="18" rx="3" fill="rgba(255,80,40,0.05)"/>
    <rect x="820" y="152" width="580" height="18" rx="3" fill="rgba(255,80,40,0.04)"/>
    <rect x="860" y="184" width="520" height="18" rx="3" fill="rgba(255,80,40,0.05)"/>
    <rect x="860" y="216" width="460" height="18" rx="3" fill="rgba(255,80,40,0.04)"/>
    <rect x="820" y="248" width="540" height="18" rx="3" fill="rgba(255,80,40,0.03)"/>
    <rect x="860" y="280" width="480" height="18" rx="3" fill="rgba(255,80,40,0.04)"/>
    <rect x="820" y="312" width="380" height="18" rx="3" fill="rgba(255,80,40,0.03)"/>
    <rect x="820" y="360" width="600" height="18" rx="3" fill="rgba(255,80,40,0.05)"/>
    <rect x="860" y="392" width="540" height="18" rx="3" fill="rgba(255,80,40,0.04)"/>
    <rect x="860" y="424" width="460" height="18" rx="3" fill="rgba(255,80,40,0.05)"/>
    <rect x="820" y="456" width="500" height="18" rx="3" fill="rgba(255,80,40,0.03)"/>
    <rect x="860" y="488" width="420" height="18" rx="3" fill="rgba(255,80,40,0.04)"/>
    <rect x="820" y="520" width="560" height="18" rx="3" fill="rgba(255,80,40,0.03)"/>
    <rect x="820" y="568" width="480" height="18" rx="3" fill="rgba(255,80,40,0.04)"/>
    <rect x="860" y="600" width="400" height="18" rx="3" fill="rgba(255,80,40,0.03)"/>
    <rect x="820" y="632" width="520" height="18" rx="3" fill="rgba(255,80,40,0.04)"/>
    <rect x="820" y="664" width="360" height="18" rx="3" fill="rgba(255,80,40,0.03)"/>

    <line x1="800" y1="80" x2="800" y2="760" stroke="rgba(255,80,40,0.08)" stroke-width="1"/>

    <ellipse cx="400" cy="420" rx="200" ry="180" fill="#cc2200" opacity="0.1" filter="url(#atmosBlur)"/>
    <polygon points="400,230 490,255 545,330 545,510 490,585 400,610 310,585 255,510 255,330 310,255"
             fill="url(#rubyGrad)" filter="url(#rubyGlow)"/>
    <polygon points="400,230 490,255 545,330 545,510 490,585 400,610 310,585 255,510 255,330 310,255"
             fill="url(#rubyShine)"/>
    <polygon points="400,260 475,280 520,340 520,500 475,560 400,580 325,560 280,500 280,340 325,280"
             fill="none" stroke="rgba(255,180,150,0.15)" stroke-width="1"/>
    <polygon points="400,300 460,318 498,365 498,475 460,522 400,540 340,522 302,475 302,365 340,318"
             fill="none" stroke="rgba(255,180,150,0.12)" stroke-width="1"/>
    <circle cx="400" cy="420" r="30" fill="rgba(255,150,100,0.2)" filter="url(#softGlow)"/>
    <circle cx="400" cy="420" r="14" fill="rgba(255,180,140,0.4)"/>
    <circle cx="400" cy="420" r="6"  fill="rgba(255,200,180,0.7)"/>
    <polygon points="400,245 460,268 400,310 340,268" fill="rgba(255,200,180,0.15)"/>
    <polygon points="255,330 310,255 310,290 268,360" fill="rgba(255,180,150,0.1)"/>

    <text x="120" y="108" font-family="monospace" font-size="12" fill="rgba(255,100,60,0.5)" letter-spacing="3">ENGINEERING · OPINION</text>
    <line x1="120" y1="116" x2="380" y2="116" stroke="rgba(255,80,40,0.15)" stroke-width="0.5"/>

    <rect x="120" y="134" width="84" height="34" rx="2" fill="rgba(255,60,30,0.12)" stroke="rgba(255,80,40,0.2)" stroke-width="1"/>
    <text x="162" y="156" text-anchor="middle" font-family="monospace" font-size="13" fill="rgba(255,100,60,0.7)" letter-spacing="1">2026</text>

    <text x="120" y="248" font-family="Georgia, serif" font-size="82" font-weight="900" fill="#f5ebe6" letter-spacing="-2">Why I</text>
    <text x="120" y="338" font-family="Georgia, serif" font-size="82" font-weight="900" fill="#f5ebe6" letter-spacing="-2">Still</text>
    <text x="120" y="428" font-family="Georgia, serif" font-size="96" font-weight="900" fill="#cc3300" letter-spacing="-2" font-style="italic">Love</text>
    <text x="120" y="518" font-family="Georgia, serif" font-size="82" font-weight="900" fill="#f5ebe6" letter-spacing="-2">Ruby on</text>
    <text x="120" y="608" font-family="Georgia, serif" font-size="82" font-weight="900" fill="#f5ebe6" letter-spacing="-2">Rails</text>

    <text x="120" y="658" font-family="monospace" font-size="15" fill="rgba(255,255,255,0.25)" letter-spacing="1">Four years. Real production. Honest audit.</text>

    <line x1="120" y1="695" x2="740" y2="695" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="120" y="724" font-family="monospace" font-size="13" fill="rgba(255,255,255,0.35)" letter-spacing="1">Mohun Shakeel Ahmad</text>
    <text x="120" y="744" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.15)" letter-spacing="1">Software Engineer · SharinPix · Mauritius</text>

    <rect x="620" y="708" width="120" height="30" rx="2" fill="rgba(255,80,40,0.08)" stroke="rgba(255,80,40,0.15)" stroke-width="1"/>
    <text x="680" y="728" text-anchor="middle" font-family="monospace" font-size="11" fill="rgba(255,100,60,0.5)" letter-spacing="1">6 MIN READ</text>

    <rect width="1600" height="840" fill="url(#vignette)"/>
  </g>
