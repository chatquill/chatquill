<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>The Exact Moment Your Data Gets Sold — and Who's Buying It</title>
  <desc>Article cover image showing a dark background with data surveillance theme</desc>

  <defs>
    <radialGradient id="bgGlow" cx="30%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#04050a"/>
    </radialGradient>
    <radialGradient id="accentGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#533AB7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#533AB7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#AFA9EC" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7F77DD" stop-opacity="0.3"/>
    </radialGradient>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- Ambient glow blobs -->
  <ellipse cx="260" cy="310" rx="320" ry="260" fill="url(#accentGlow)" filter="url(#softBlur)"/>
  <ellipse cx="900" cy="200" rx="180" ry="140" fill="#3C3489" fill-opacity="0.18" filter="url(#softBlur)"/>
  <ellipse cx="1050" cy="480" rx="140" ry="110" fill="#533AB7" fill-opacity="0.12" filter="url(#softBlur)"/>

  <!-- Grid lines (subtle) -->
  <g stroke="#AFA9EC" stroke-opacity="0.06" stroke-width="0.8">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Network nodes & connection lines (right side decorative) -->
  <g stroke="#7F77DD" stroke-opacity="0.25" stroke-width="0.8" fill="none">
    <line x1="780" y1="120" x2="900" y2="200"/>
    <line x1="900" y1="200" x2="1020" y2="150"/>
    <line x1="900" y1="200" x2="970" y2="330"/>
    <line x1="1020" y1="150" x2="1100" y2="270"/>
    <line x1="970" y1="330" x2="1100" y2="270"/>
    <line x1="970" y1="330" x2="870" y2="440"/>
    <line x1="1100" y1="270" x2="1150" y2="400"/>
    <line x1="870" y1="440" x2="1000" y2="500"/>
    <line x1="1150" y1="400" x2="1000" y2="500"/>
    <line x1="780" y1="120" x2="860" y2="80"/>
    <line x1="860" y1="80" x2="1020" y2="150"/>
    <line x1="780" y1="510" x2="870" y2="440"/>
    <line x1="1000" y1="500" x2="1100" y2="560"/>
  </g>

  <!-- Network dots -->
  <g fill="url(#dotGlow)">
    <circle cx="780" cy="120" r="4"/>
    <circle cx="900" cy="200" r="6"/>
    <circle cx="1020" cy="150" r="4"/>
    <circle cx="970" cy="330" r="5"/>
    <circle cx="1100" cy="270" r="4"/>
    <circle cx="870" cy="440" r="4"/>
    <circle cx="1000" cy="500" r="5"/>
    <circle cx="1150" cy="400" r="3.5"/>
    <circle cx="860" cy="80" r="3"/>
    <circle cx="780" cy="510" r="3.5"/>
    <circle cx="1100" cy="560" r="3"/>
  </g>
  <!-- Bright highlight on central node -->
  <circle cx="900" cy="200" r="6" fill="#EEEDFE" fill-opacity="0.9"/>
  <circle cx="970" cy="330" r="5" fill="#EEEDFE" fill-opacity="0.7"/>

  <!-- Left: phone silhouette -->
  <g opacity="0.18">
    <rect x="88" y="170" width="110" height="200" rx="14" fill="none" stroke="#AFA9EC" stroke-width="1.2"/>
    <!-- screen -->
    <rect x="96" y="184" width="94" height="160" rx="4" fill="#2a1a5e" fill-opacity="0.6"/>
    <!-- lines simulating content -->
    <rect x="104" y="198" width="60" height="5" rx="2" fill="#7F77DD" fill-opacity="0.5"/>
    <rect x="104" y="210" width="78" height="4" rx="2" fill="#7F77DD" fill-opacity="0.3"/>
    <rect x="104" y="220" width="50" height="4" rx="2" fill="#7F77DD" fill-opacity="0.3"/>
    <rect x="104" y="240" width="78" height="28" rx="4" fill="#533AB7" fill-opacity="0.3"/>
    <!-- home button -->
    <circle cx="143" cy="356" r="8" fill="none" stroke="#AFA9EC" stroke-width="1"/>
  </g>

  <!-- Pill tag: data broker -->
  <rect x="72" y="460" width="148" height="32" rx="16" fill="#26215C" fill-opacity="0.85"/>
  <text x="146" y="481" font-family="system-ui, sans-serif" font-size="13" fill="#CECBF6" fill-opacity="0.9" text-anchor="middle" font-weight="500">data broker</text>

  <!-- Pill tag: 100ms auction -->
  <rect x="650" y="96" width="176" height="32" rx="16" fill="#26215C" fill-opacity="0.75"/>
  <text x="738" y="117" font-family="system-ui, sans-serif" font-size="13" fill="#CECBF6" fill-opacity="0.9" text-anchor="middle" font-weight="500">100ms auction</text>

  <!-- Pill tag: device fingerprint -->
  <rect x="72" y="130" width="182" height="32" rx="16" fill="#26215C" fill-opacity="0.75"/>
  <text x="163" y="151" font-family="system-ui, sans-serif" font-size="13" fill="#CECBF6" fill-opacity="0.9" text-anchor="middle" font-weight="500">device fingerprint</text>

  <!-- Divider line -->
  <line x1="72" y1="520" x2="660" y2="520" stroke="#533AB7" stroke-opacity="0.35" stroke-width="0.8"/>

  <!-- Main headline -->
  <text x="72" y="282" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700" fill="#EEEDFE" letter-spacing="-1">The Exact Moment</text>
  <text x="72" y="346" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700" fill="#EEEDFE" letter-spacing="-1">Your Data Gets Sold</text>

  <!-- Subtitle -->
  <text x="72" y="404" font-family="system-ui, sans-serif" font-size="22" fill="#AFA9EC" font-weight="400" letter-spacing="0.2">— and Who's Buying It</text>

  <!-- Author -->
  <text x="72" y="560" font-family="system-ui, sans-serif" font-size="15" fill="#7F77DD" font-weight="400" letter-spacing="0.3">Mohun Shakeel Ahmad</text>

  <!-- Tag line -->
  <text x="72" y="590" font-family="system-ui, sans-serif" font-size="13" fill="#534AB7" font-weight="400">Software Engineer · Data Science · Tech Writing</text>

  <!-- Small "eye" icon top-right watermark -->
  <g transform="translate(1120, 56)" opacity="0.22">
    <ellipse cx="0" cy="0" rx="26" ry="16" fill="none" stroke="#AFA9EC" stroke-width="1.4"/>
    <circle cx="0" cy="0" r="8" fill="none" stroke="#AFA9EC" stroke-width="1.4"/>
    <circle cx="0" cy="0" r="3" fill="#AFA9EC"/>
  </g>

</svg>
